            - heading "Project Details" [level=3] [ref=e224]
            - group [ref=e225]:
              - generic [ref=e226]:
                - paragraph [ref=e227]: Project Structure
                - text: "*"
              - text: Provide a detailed breakdown of the project scope of work and timeline including milestones, deliverables, and expected outcomes.
              - textbox "Project Structure" [ref=e228]: "Week 1-2: Test suite — unit and integration tests, CI pipeline setup, coverage reporting (target: 80%+). Week 3-4: Full API documentation and JSDoc, architecture diagrams. Week 5-6: Integration guides for Express, Next.js, Fastify with code examples. Week 7-8: Native ETH transfer logs support (Glamsterdam EIP) — update event listener to handle new log format; example repos published; Docker Compose production templates. Week 9-10: Security review of codebase. Week 11-12: Documentation site, community articles on Dev.to and Ethereum StackExchange, ecosystem outreach. Deliverables: test suite with 80%+ coverage, full API docs, 2+ integration example repos, native ETH transfer log support, security review report, documentation site."
            - group [ref=e229]:
              - generic [ref=e230]:
                - paragraph [ref=e231]: Sustainability Plan
                - text: "*"
              - text: Share plans towards achieving sustainability (both financial and non-financial) for this project in future.
              - textbox "Sustainability Plan" [ref=e232]: "Blockpulse is already being used in production (DotFlat on Ethereum mainnet) so the core tool is self-sustaining as long as DotFlat operates. Long-term, the plan is an open-core model: the self-hosted tool remains MIT-licensed and free forever, while a managed cloud version (hosted Blockpulse with dashboard, alerting, and multi-chain support) is offered as a paid SaaS. This follows the model of tools like Grafana, Sentry, and Posthog. The open source community adoption and GitHub stars from the grant-funded outreach will directly support the commercial viability of the managed offering."
            - group [ref=e233]:
              - generic [ref=e234]:
                - paragraph [ref=e235]: Funding
                - text: "*"
              - text: Have you received or discussed funding for this project from other parties?
              - textbox "Funding" [ref=e236]: No external funding received or discussed for Blockpulse. The project was self-funded as part of DotFlat development.
            - group [ref=e237]:
              - generic [ref=e238]:
                - paragraph [ref=e239]: Problem Being Solved
                - text: "*"
              - text: Within this domain, what is the problem identified, who is affected by it, and how does this project provide a solution? Provide concrete examples.
              - textbox "Problem Being Solved" [ref=e240]: "dApp developers caching Ethereum contract reads use TTL-based expiry (typically 60 seconds). This creates two problems: (1) data is always stale by design — users see outdated state for up to 60 seconds after their transaction confirms; (2) RPC calls happen on a timer regardless of on-chain activity — pure waste during quiet periods. Blockpulse solves this by watching for transactions to configured contracts and deleting Redis keys immediately when state changes. With TTL=0, cache entries are valid indefinitely and invalidated only on actual on-chain events. For a lending protocol with low activity, this means zero RPC calls during quiet periods and fresh data within one block of any transaction. The Glamsterdam-specific extension: native ETH transfer logs will enable the same event-driven invalidation for ETH balances — currently impossible because native ETH transfers emit no logs. Blockpulse will be updated to consume these new logs on day one of Glamsterdam."
            - group [ref=e241]:
              - generic [ref=e242]:
                - paragraph [ref=e243]: Measured Impact
                - text: "*"
              - text: Depending on the stage of this project, provide metrics for the project's current impact on the ecosystem, e.g. users, page visits, code contributors.
              - textbox "Measured Impact" [ref=e244]: "Blockpulse has been running in production as part of DotFlat on Ethereum mainnet since 2025, watching 7 smart contracts including CDP, oracle, deposit, auction, and Uniswap V4 PoolManager. It processes every Ethereum mainnet block and has handled all DotFlat user transactions without downtime. The codebase is ~1,700 lines of production-hardened Node.js. As of launch on GitHub (May 2026): early community interest via posts on r/ethdev and Dev.to."
            - group [ref=e245]:
              - generic [ref=e246]:
                - paragraph [ref=e247]: Success Metrics
                - text: "*"
              - text: What quantifiable measurements will be used to gauge the success of this project after completion?
              - textbox "Success Metrics" [ref=e248]: "- Test coverage >= 80% (measurable via CI) - Full API reference documentation published - >= 2 open-source integration example repositories - Native ETH transfer log support shipped before Glamsterdam mainnet activation - Security review completed and report published publicly - >= 50 GitHub stars within 3 months of grant completion - >= 3 external projects publicly integrating Blockpulse"
              - generic [ref=e661]: Success metrics must contain at least 500 character(s)
            - group [ref=e249]:
              - generic [ref=e250]:
                - paragraph [ref=e251]: Ecosystem Fit
                - text: "*"
              - text: Compare your project to 2-3 similar projects in the ecosystem. How is your work unique or novel?
              - textbox "Ecosystem Fit" [ref=e252]: "1. Eventeum (507 stars, Java) — closest conceptual match but abandoned since 2020, Java-only, no Redis integration, no REST API. 2. Alchemy Notify / QuickNode Streams — webhook services that notify your app of transactions but do NOT perform cache invalidation; require a paid external service. 3. DIY polling loops — the most common approach; every team rebuilds the same solution from scratch with no shared open-source baseline. Blockpulse is unique in: (a) being purpose-built for Redis cache invalidation rather than general event notification; (b) providing a REST API for cached contract calls alongside invalidation; (c) being self-hostable with zero vendor dependency; (d) supporting Glamsterdam native ETH transfer logs from day one."
            - group [ref=e253]:
              - generic [ref=e254]:
                - paragraph [ref=e255]: Community Feedback
                - text: "*"
              - text: What domain expert or community feedback have you received for this project?
              - textbox "Community Feedback" [ref=e256]: The project was just open-sourced (May 2026) after being extracted from DotFlat. Initial posts on r/ethdev and Dev.to are live. No formal expert review yet — part of the grant deliverables is broader community engagement and feedback collection. The DotFlat community (users of the stablecoin protocol on mainnet) has validated the approach through production use.
