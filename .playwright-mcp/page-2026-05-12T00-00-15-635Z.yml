              - textbox "Project Name" [ref=e182]: Blockpulse
            - group [ref=e183]:
              - generic [ref=e184]:
                - paragraph [ref=e185]: Project Summary
                - text: "*"
              - text: Describe your project in a few sentences, including what is being built and why it matters. Provide links to any existing public or published work.
              - textbox "Project Summary" [ref=e186]: "Blockpulse is an open-source Node.js service that watches Ethereum contracts and invalidates Redis cache entries the moment a transaction is mined. It eliminates the TTL-based caching tradeoff for dApp developers: cache entries live indefinitely and are deleted only when on-chain state actually changes. Blockpulse also indexes decoded events and transactions, serves a REST API for cached contract method calls, and backfills history via Etherscan API. It has been running in production on Ethereum mainnet as part of DotFlat (https://github.com/nagor2/blockpulse). The Glamsterdam-specific deliverable: full support for native ETH transfer logs (EIP included in Glamsterdam), making Blockpulse the first open-source tool enabling event-driven Redis invalidation for native ETH transfers."
