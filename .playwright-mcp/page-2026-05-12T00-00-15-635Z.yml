            - paragraph [ref=e72]: "Selected Wishlist:"
            - paragraph [ref=e73]: Glamsterdam Grants Round
            - paragraph [ref=e74]: "The upcoming Glamsterdam upgrade is expected to introduce changes to EVM capabilities, protocol architecture, Ethereum's gas pricing, etc. Among the changes being considered are a comprehensive gas repricing package, new EVM opcodes, increased max contract size, native ETH transfer logs, validator exit/consolidation improvements, and two protocol-level headliners: Enshrined Proposer-Builder Separation (ePBS) and Block-Level Access Lists (BALs). Some of these changes, particularly gas repricing, may affect every transaction and deployed contract on Ethereum. We are seeking grant proposals that help the Ethereum community prepare for and adapt to the Glamsterdam upgrade. Areas of interest include, but are not limited to: - Developer tooling updates - Impact analysis tooling - Added support for block explorers and indexers - Validator tooling - Monitoring tooling - Data-driven research Proposals should include clear deliverables, milestones, and a realistic timeline. Evidence of demonstrable prior relevant work – such as contributions to previous upgrade readiness efforts, existing open-source Ethereum tooling, or published research on protocol changes – will be considered favourably during evaluation. For reference, the previous Pectra Grant Round awarded a total of around $250k across more than 10 projects. Note: some Glamsterdam EIPs are still under consideration and may not be included in the final upgrade. Applicants should review the current status of relevant EIPs via EIP-7773 and Forkcast.org."
