                - strong [ref=e87]: Request Form
                - text: . Or you can visit this
                - link "link" [ref=e88] [cursor=pointer]:
                  - /url: https://partner.coingecko.com/request-form/new
                - text: directly.
            - paragraph [ref=e89]:
              - img [ref=e90]
