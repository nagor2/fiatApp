            - paragraph [ref=e68]:
              - text: Before applying, please ensure you meet our important prerequisites. First, your cryptocurrency must be actively tradable on a cryptocurrency exchange tracked by CoinGecko; you can view our supported markets on our
              - link "Exchange page" [ref=e69] [cursor=pointer]:
                - /url: https://www.coingecko.com/en/exchanges
              - text: .
            - paragraph [ref=e70]: Additionally, please do not ask your community to spam CoinGecko with "When list?" inquiries, as repeated spam will result in your coin or token being disqualified from listing.
            - heading "Step-by-Step Submission Guide" [level=3] [ref=e71]:
              - strong [ref=e72]: Step-by-Step Submission Guide
            - paragraph [ref=e73]: "To submit your token or coin for listing, please follow these simple steps:"
            - list [ref=e74]:
              - listitem [ref=e75]:
                - strong [ref=e76]: "Log In:"
                - text: Log in to your CoinGecko account. If you do not have an account, you will need to sign up first. You can read this article,
                - emphasis [ref=e77]: "["
                - link "How do I sign up for a CoinGecko account?" [ref=e78] [cursor=pointer]:
                  - /url: https://support.coingecko.com/hc/en-us/articles/7248470874649-How-do-I-sign-up-for-a-CoinGecko-account
                  - emphasis [ref=e79]: How do I sign up for a CoinGecko account?
                - emphasis [ref=e80]: "]"
                - text: ", for further information."
