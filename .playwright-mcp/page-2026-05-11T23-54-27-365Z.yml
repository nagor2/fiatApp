        - generic [ref=e83]:
          - generic [ref=e84]:
            - heading "Mission and Scope" [level=2] [ref=e85]
            - paragraph [ref=e86]: ESP provides financial and/or non-financial support to eligible projects working to improve Ethereum. We focus on work that strengthens Ethereum's foundations and enables future builders. The work we support is free, open-source, non-commercial, and designed to create positive sum outcomes for the community.
            - paragraph [ref=e87]: "Our support is generally directed toward enabling builders rather than end-users: strengthening Ethereum's infrastructure, expanding the range of tools available to those building on Ethereum, gaining a deeper understanding of cryptographic primitives, growing the builder ecosystem through education and community development, etc."
          - generic [ref=e88]:
            - heading "Process" [level=3] [ref=e89]
            - generic [ref=e90]:
              - generic [ref=e91]:
                - heading "Browse" [level=4] [ref=e94]
                - paragraph [ref=e96]: Browse the available Wishlist or RFP items and find one that matches your interests and expertise. Each item includes a detailed description and, when applicable, relevant resources.
                - img "next step arrow" [ref=e99]
              - generic [ref=e100]:
                - heading "Apply" [level=4] [ref=e103]
                - paragraph [ref=e105]: Submit your application detailing how you plan to address the Wishlist or RFP item. Describe how your background and approach align with the project requirements by providing clear information on your methodology, timeline, and deliverables. Once submitted, you will receive a confirmation email.
                - img "next step arrow" [ref=e108]
              - generic [ref=e109]:
                - heading "Review" [level=4] [ref=e112]
                - paragraph [ref=e114]: "The Grant Management (GM) team reviews applications in collaboration with the EF team responsible for the corresponding Wishlist or RFP item. The evaluation process may include: an interview to discuss your proposal in detail, project rescoping, or budget negotiations."
                - img "next step arrow" [ref=e117]
              - generic [ref=e118]:
                - heading "Decision" [level=4] [ref=e121]
                - paragraph [ref=e123]: You will be notified of funding decisions via email. If your project is selected, we will work closely with you to establish a clear grant structure with milestone-based payments. All grant recipients also complete an onboarding process, involving KYC verification and signing a legal grant agreement.
                - img "next step arrow" [ref=e126]
              - generic [ref=e127]:
                - heading "Execute" [level=4] [ref=e130]
                - paragraph [ref=e132]: Begin work on your project with ongoing support from the GM team. You will be paired with a Grant Evaluator for regular check-ins, milestone reviews, and support as you progress.
                - img "next step arrow" [ref=e135]
              - generic [ref=e136]:
                - heading "Complete" [level=4] [ref=e139]
                - paragraph [ref=e141]: Once the scope of work is completed, you will share the results publicly in a report or post.
          - generic [ref=e142]:
            - heading "Selection criteria" [level=3] [ref=e143]
            - paragraph [ref=e144]: "Applications are evaluated based on several key factors, such as:"
            - list [ref=e145]:
              - listitem [ref=e146]:
                - strong [ref=e147]: Technical approach
                - text: ": Soundness, feasibility, and clarity of your proposed methodology and implementation plan"
              - listitem [ref=e148]:
                - strong [ref=e149]: Ecosystem impact
                - text: ": Potential benefit to the Ethereum community and alignment with ecosystem priorities"
              - listitem [ref=e150]:
                - strong [ref=e151]: Open source
                - text: ": All outputs must be open-source or otherwise freely available; for-profit companies are welcome to apply, but the specific grant-funded work must be open-source and accessible to the community"
              - listitem [ref=e152]:
                - strong [ref=e153]: Budget
                - text: ": Cost-effectiveness and appropriate allocation of resources; since we are offering non-dilutive capital, we generally anticipate some flexibility below standard market rates"
              - listitem [ref=e154]:
                - strong [ref=e155]: Experience
                - text: ": Relevant background, skills, and prior work that demonstrate capability"
              - listitem [ref=e156]:
                - strong [ref=e157]: Alignment
                - text: ": Understanding of Ethereum's values and ecosystem needs, and how your work contributes to them"
