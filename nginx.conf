user  nginx;
worker_processes  1;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;
events {
  worker_connections  1024;
}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"';
  client_max_body_size 1024m;
  access_log  /dev/stdout  main;
  sendfile        on;
  keepalive_timeout  65;
  # DNS resolver для динамического разрешения upstream имён
  resolver 127.0.0.11 valid=30s;
  resolver_timeout 10s;
  
  server {
    listen       80;
    server_name  localhost;
    
    # Proxy для Backend API (кэшированные данные контрактов)
    location /api/contracts {
      proxy_pass http://app-backend:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
    
    # Proxy для Ethereum RPC (решает CORS проблему)
    # Используйте переменную окружения RPC_ENDPOINT для настройки backend
    location /api/rpc {
      # По умолчанию используется публичный endpoint для тестирования
      # В production замените на свой RPC provider
      set $rpc_backend "ethereum.publicnode.com";
      
      # Убираем /api/rpc из проксируемого пути
      # ^/api/rpc -> /
      # ^/api/rpc/ -> /
      # ^/api/rpc/something -> /something
      rewrite ^/api/rpc/?(.*)$ /$1 break;
      
      proxy_pass https://$rpc_backend;
      proxy_ssl_server_name on;
      proxy_ssl_protocols TLSv1.2 TLSv1.3;
      proxy_set_header Host $rpc_backend;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # Таймауты для RPC
      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      
      # Буферизация для больших ответов
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
      proxy_busy_buffers_size 8k;
      
      # CORS заголовки
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      
      # Preflight requests
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        return 204;
      }
    }
    
    location / {
      root   /app;
      index  index.html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}
