user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;
events {
  worker_connections  4096;
  multi_accept on;
  use epoll;
}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"';
  client_max_body_size 1024m;
  access_log  /dev/stdout  main;
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  keepalive_requests 1000;

  # Cache open file descriptors — avoids stat()/open() on every static request
  open_file_cache          max=10000 inactive=30s;
  open_file_cache_valid    60s;
  open_file_cache_min_uses 2;
  open_file_cache_errors   on;

  # gzip для статики (JS/CSS/шрифты/SVG).
  # Сжимает ответы с указанными MIME и размером > gzip_min_length.
  # gzip_proxied any — сжимать даже когда запрос пришёл через прокси
  # (в k8s ingress это норма). gzip_vary — корректный Vary: Accept-Encoding
  # для промежуточных кэшей.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/x-javascript
    image/svg+xml
    font/ttf
    font/otf;
  # DNS resolver кластера Kubernetes (CoreDNS/kube-dns).
  # Используется для позднего (runtime) резолва upstream'ов через переменную
  # в proxy_pass — это не даёт nginx падать при старте, если Service
  # ещё не готов. ipv6=off — чтобы не было пустых AAAA-ответов.
  resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
  resolver_timeout 5s;

  # Persistent connection pools to backend services.
  # keepalive = max idle connections kept open per worker.
  # Without this, every proxied request opens a new TCP connection (expensive).
  # Note: proxy_http_version 1.1 + proxy_set_header Connection "" are required
  # to actually use keepalive with HTTP/1.1 upstreams.
  upstream backend_upstream {
    server backend.app-dotflat.svc.cluster.local:3001;
    keepalive 16;
  }

  upstream watcher_upstream {
    server watcher.app-dotflat.svc.cluster.local:3002;
    keepalive 32;
  }

  server {
    listen       80;
    server_name  localhost;

    # Proxy для Backend API (кэшированные данные контрактов).
    # Используем FQDN + переменную: nginx резолвит имя на каждый запрос,
    # а не один раз при старте — иначе контейнер крэшится, если Service
    # backend временно отсутствует/перезапускается.
    location /api/contracts {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    location /api/0x/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 10s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
    }

    location /api/ethprice {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 10s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
    }

    location /api/prices {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    location /api/worker/ {
      rewrite ^/api/worker/(.*)$ /$1 break;
      proxy_pass http://watcher_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
    
    # Proxy для Ethereum RPC — routes through backend which has multi-URL fallback.
    location /api/rpc {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
    
    # Hashed JS/CSS chunks — cache forever (hash changes on content change)
    location ~* ^/static/.+\.(js|css|woff2?|ttf|otf|svg|png|jpg|ico)$ {
      root /app;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # favicon and logo — essentially never change, cache for 30 days
    location ~* ^/(favicon\.ico|assets/logo\.png)$ {
      root /app;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Root-level images (from public/ — no hash, but rarely change)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
      root /app;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=604800";
    }

    location / {
      root   /app;
      index  index.html;
      try_files $uri $uri/ /index.html;
      # Only index.html must never be cached (it references hashed chunk filenames)
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}
