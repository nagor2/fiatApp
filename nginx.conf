user  nginx;
worker_processes  1;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;
events {
  worker_connections  1024;
}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"';
  client_max_body_size 1024m;
  access_log  /dev/stdout  main;
  sendfile        on;
  keepalive_timeout  65;
  # DNS resolver кластера Kubernetes (CoreDNS/kube-dns).
  # Используется для позднего (runtime) резолва upstream'ов через переменную
  # в proxy_pass — это не даёт nginx падать при старте, если Service
  # ещё не готов. ipv6=off — чтобы не было пустых AAAA-ответов.
  resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
  resolver_timeout 5s;

  server {
    listen       80;
    server_name  localhost;

    # Proxy для Backend API (кэшированные данные контрактов).
    # Используем FQDN + переменную: nginx резолвит имя на каждый запрос,
    # а не один раз при старте — иначе контейнер крэшится, если Service
    # backend временно отсутствует/перезапускается.
    location /api/contracts {
      set $backend_upstream "backend.app-dotflat.svc.cluster.local:3001";
      proxy_pass http://$backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    # Proxy для block-watcher worker API (health, /api/events, /api/transactions,
    # /api/contracts (список наблюдаемых), /api/call, /api/renewCache, /api/eth/*).
    # Тот же приём с переменной для позднего DNS-резолва.
    # Обрезаем префикс /api/worker — на upstream идут исходные пути воркера.
    location /api/worker/ {
      set $watcher_upstream "watcher.app-dotflat.svc.cluster.local:3002";
      rewrite ^/api/worker/(.*)$ /$1 break;
      proxy_pass http://$watcher_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
    
    # Proxy для Ethereum RPC (решает CORS проблему)
    # Используйте переменную окружения RPC_ENDPOINT для настройки backend
    location /api/rpc {
      # По умолчанию используется публичный endpoint для тестирования
      # В production замените на свой RPC provider
      set $rpc_backend "ethereum.publicnode.com";
      
      # Убираем /api/rpc из проксируемого пути
      # ^/api/rpc -> /
      # ^/api/rpc/ -> /
      # ^/api/rpc/something -> /something
      rewrite ^/api/rpc/?(.*)$ /$1 break;
      
      proxy_pass https://$rpc_backend;
      proxy_ssl_server_name on;
      proxy_ssl_protocols TLSv1.2 TLSv1.3;
      proxy_set_header Host $rpc_backend;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # Таймауты для RPC
      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      
      # Буферизация для больших ответов
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
      proxy_busy_buffers_size 8k;
      
      # CORS заголовки
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      
      # Preflight requests
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        return 204;
      }
    }
    
    location / {
      root   /app;
      index  index.html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}
